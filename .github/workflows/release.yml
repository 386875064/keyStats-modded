name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  # ============================================================
  # Windows Build（纯离线版，只发布 Windows 便携包）
  # ============================================================
  build-windows:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.VERSION }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version
        id: version
        shell: bash
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Update app version
        shell: pwsh
        run: |
          $csprojPath = "KeyStats.Windows/KeyStats/KeyStats.csproj"
          $version = "${{ steps.version.outputs.VERSION }}"
          (Get-Content $csprojPath) -replace '<Version>.*</Version>', "<Version>$version</Version>" | Set-Content $csprojPath
          Write-Host "Updated Version to $version"

      - name: Build Windows app
        shell: pwsh
        working-directory: KeyStats.Windows
        run: |
          # 纯离线构建：不依赖同步服务地址
          dotnet build KeyStats/KeyStats.csproj -c Release -o dist/KeyStats-Portable

      - name: Package portable zip
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.VERSION }}"
          Compress-Archive -Path "KeyStats.Windows/dist/KeyStats-Portable/*" `
                           -DestinationPath "KeyStats.Windows/dist/KeyStats-Windows-$version.zip" -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: KeyStats.Windows/dist/*.zip

  # ============================================================
  # Create Release
  # ============================================================
  create-release:
    needs: build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-zip
          path: release-assets/windows

      - name: List artifacts
        run: ls -la release-assets/windows

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            release-assets/windows/*.zip
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-beta') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
